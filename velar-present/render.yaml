services:
  - type: web
    name: velar-present
    runtime: node
    rootDir: velar-present
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: MAX_UPLOAD_MB
        value: "1024"
    disk:
      name: decks
      mountPath: /var/data
      sizeGB: 5
